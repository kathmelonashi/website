<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pottery Studio</title>

    <!-- Tailwind -->
    <script src="https://cdn.tailwindcss.com/3.4.17"></script>

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Lora:wght@400;500;600&display=swap" rel="stylesheet">

    <!-- Your CSS -->
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <div id="app-wrapper">
        <header class="header">
        <button class="menu-toggle" id="menu-toggle">
            <span></span>
            <span></span>
            <span></span>
        </button>
        </header>

        <div class="menu-overlay" id="menu-overlay"></div>

        <nav class="side-menu" id="side-menu">
        <button class="menu-item" onclick="navigateTo('home')">Home</button>
        <button class="menu-item" onclick="navigateTo('gallery')">Gallery</button>
        <button class="menu-item" onclick="navigateTo('about')">About</button>
        </nav>

        <!-- HOME -->
        <div id="home-tab" class="tab-content active">
        <div class="home-page">
            <div class="home-hero">
            <div class="home-emoji"></div>
            <h1 class="home-title" id="home-studio-name">My Pottery Studio</h1>
            <p class="home-tagline" id="home-tagline">Handcrafted with Love</p>
            <p class="home-text" id="home-about"></p>
            <button class="cta-button" onclick="navigateTo('gallery')">
                Explore Gallery
            </button>
            </div>
        </div>
        </div>

        <!-- GALLERY -->
        <div id="gallery-tab" class="tab-content">
        <div class="gallery-page">
            <h2 class="gallery-title">Featured Pieces</h2>
            <div id="gallery-container" class="gallery-grid"></div>
        </div>
        </div>

        <!-- ABOUT -->
        <div id="about-tab" class="tab-content">
        <div class="about-page">
            <div class="about-container">
            <h2 class="about-title">About My Work</h2>
            <p class="about-content" id="about-studio-name"></p>
            </div>
        </div>
        </div>
    </div>

    <!-- Your JS -->
    <script src="script.js"></script>
</body>
</html>
